# docker compose up -d --build
# 访问 http://<服务器IP>:8080
#
# 数据默认放在 Docker 命名卷 mculab-data：容器以非 root（node, uid 1000）运行，
# 命名卷会继承镜像内 /app/data 的属主，不会出现"SQLite 只读"的坑。
# 想直接用宿主机目录（便于备份）见文件末尾注释。
services:
  mculab:
    build: .
    image: mculab:latest
    container_name: mculab
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 首次启动创建教师账号时使用；账号已存在则忽略
      MCULAB_TEACHER_PWD: "${MCULAB_TEACHER_PWD:-teacher123}"
      TZ: Asia/Shanghai
    volumes:
      - mculab-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mculab-data:

# ------------------------------------------------------------------
# 想用宿主机目录（便于直接拷走备份）时，把上面的 volumes 换成：
#
#   volumes:
#     - ./data:/app/data
#
# 并先让 uid 1000 可写，否则 SQLite 会报错：
#
#   mkdir -p data && sudo chown -R 1000:1000 data
#
# 备份命名卷：
#   docker run --rm -v mculab-data:/d -v "$PWD":/b alpine \
#     tar czf /b/mculab-data.tgz -C /d .
# ------------------------------------------------------------------
